<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rizney Music Archive</title>
  <style>
    :root{--black:#000;--panel:#120b18;--purple:#c084fc;--bright-purple:#e0aaff;--gold:#d4af37;--bright-gold:#f5d76e;--muted:#b9a8c5}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--purple);background:var(--black);font-family:Georgia,"Times New Roman",serif}.top-area{position:relative;padding:10px 14px 18px;text-align:center}.donate{position:absolute;top:10px;left:10px;border:1px solid var(--gold);border-radius:999px;padding:5px 9px;color:var(--bright-gold);background:#160c1c;font-size:.68rem;text-decoration:none}h1{margin:64px 0 0;color:var(--bright-gold);font-size:1.55rem;letter-spacing:.08em}.tagline{margin-top:6px;color:var(--muted);font-size:.78rem}.player-dock{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.98);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);box-shadow:0 3px 28px rgba(0,0,0,.9)}.player-wrap{width:100%;max-width:620px;margin:auto;aspect-ratio:16/9;background:#090509}.#player{width:100%;height:100%;border:0;display:block}#now-playing{padding:7px 10px 4px;color:var(--bright-purple);background:#050305;font-size:.85rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 8px 12px;background:#000;border-bottom:1px solid #3b1d50}button{border:1px solid var(--gold);border-radius:999px;padding:9px 12px;color:#fff;background:#55208a;font:inherit;font-size:.82rem;cursor:pointer}button:hover{background:#7e35bc}button:disabled{opacity:.45;cursor:not-allowed}.skip{min-width:42px;width:42px;height:38px;padding:0;font-size:1.2rem}.main{width:min(100% - 24px,900px);margin:auto;padding:18px 0 50px}.intro{color:var(--muted);text-align:center;line-height:1.45}h2{color:var(--bright-gold);font-size:1.25rem;border-bottom:1px solid var(--gold);padding-bottom:8px}#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0 22px}.card{min-height:150px;padding:9px 6px;color:var(--bright-purple);background:linear-gradient(145deg,#21102e,#090509);border:2px solid var(--gold);border-radius:12px;text-align:center}.card .symbol{display:block;color:var(--bright-gold);font-size:1.7rem;margin-bottom:6px}.card strong{display:block;margin-bottom:8px;font-size:.78rem}.card a{color:var(--bright-gold);font-size:.7rem}#song-list{display:grid;gap:8px}.song{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:10px;color:var(--purple);background:var(--panel);border:1px solid #3b1d50;border-radius:8px}.song-number{color:var(--gold);text-align:center}.song-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song small{display:block;color:var(--muted);font-family:sans-serif;font-size:.7rem;margin-top:3px}.play{padding:7px 10px;font-size:.78rem}@media(max-width:500px){.top-area{padding-top:42px}.donate{top:8px;left:8px}.h1{font-size:1.35rem}.controls{gap:6px}.button{font-size:.75rem;padding:8px 10px}.skip{width:38px;min-width:38px;height:34px}.card{min-height:130px}.song{grid-template-columns:30px 1fr auto}.song-title{font-size:.82rem}}
