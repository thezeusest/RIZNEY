<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rizney Music Archive</title>
  <style>
    :root{--black:#000;--panel:#120b18;--purple:#c084fc;--bright-purple:#e0aaff;--gold:#d4af37;--bright-gold:#f5d76e;--muted:#b9a8c5}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--purple);background:var(--black);font-family:Georgia,"Times New Roman",serif}
    .top-area{position:relative;padding:10px 14px 18px;text-align:center}.donate{position:absolute;top:10px;left:10px;border:1px solid var(--gold);border-radius:999px;padding:5px 9px;color:var(--bright-gold);background:#160c1c;font-size:.68rem;text-decoration:none}.donate:hover,button:hover{background:#7e35bc}h1{margin:4px 0 0;color:var(--bright-gold);font-size:1.55rem;letter-spacing:.08em}.tagline{margin-top:6px;color:var(--muted);font-size:.78rem}
    .player-dock{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.98);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);box-shadow:0 7px 28px rgba(0,0,0,.9),0 2px 18px rgba(212,175,55,.18)}.player-wrap{width:100%;max-width:620px;margin:auto;aspect-ratio:16/9;background:#090509}#player{width:100%;height:100%;border:0;display:block}#now-playing{padding:7px 10px 8px;color:var(--bright-purple);background:#050305;font-size:.85rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 8px 12px;background:#000;border-bottom:1px solid #3b1d50}button{border:1px solid var(--gold);border-radius:999px;padding:9px 12px;color:#fff;background:#55208a;font:inherit;font-size:.82rem;cursor:pointer}.skip{min-width:42px;font-size:1rem}.skip:disabled{opacity:.45;cursor:not-allowed}main{width:min(100% - 24px,900px);margin:0 auto;padding:18px 0 50px}.intro{color:var(--muted);text-align:center;line-height:1.45}h2{color:var(--bright-gold);font-size:1.25rem;border-bottom:1px solid var(--gold);padding-bottom:8px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:12px 0 22px}.card{min-height:180px;padding:12px;color:var(--bright-purple);background:linear-gradient(145deg,#21102e,#090509);border:2px solid var(--gold);border-radius:12px;box-shadow:inset 0 0 0 2px rgba(212,175,55,.15),0 0 14px rgba(212,175,55,.13);text-align:center}.card .symbol{display:block;color:var(--bright-gold);font-size:2rem;margin-bottom:8px}.card strong{display:block;margin-bottom:12px;font-size:.9rem}.card a{color:var(--bright-gold);font-size:.8rem}#song-list{display:grid;gap:8px}.song{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:10px;color:var(--purple);background:var(--panel);border:1px solid #3b1d50;border-radius:8px}.song-number{color:var(--gold);text-align:center}.song-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song small{display:block;color:var(--muted);font-family:sans-serif;font-size:.7rem;margin-top:3px}.play{padding:7px 10px;font-size:.78rem}@media(max-width:500px){.top-area{padding-top:42px}h1{font-size:1.35rem}.controls{gap:6px}button{font-size:.75rem;padding:8px 10px}}
  </style>
</head>
<body>
  <section class="top-area"><a class="donate" href="https://venmo.com/u/YOUR_VENMO_USERNAME" target="_blank" rel="noopener">♥ Donate</a><h1>Mix'N'Mojo</h1><div class="tagline">✦ 'N'Joy ✦ </div></section>
  <section class="player-dock"><div class="player-wrap"><div id="player"></div></div><div id="now-playing">Now playing: Song 1</div></section>
  <nav class="controls" aria-label="Music controls">
    <button id="previous-song" class="skip" type="button" aria-label="Previous song" title="Previous song">◀</button>
    <button id="random-song" type="button">♫ Random</button>
    <button id="draw-cards" type="button">✦ Draw 5 Cards</button>
    <button id="next-song" class="skip" type="button" aria-label="Next song" title="Next song">▶</button>
  </nav>
  <main><p class="intro">Browse the collection in order, or let the cards choose a song for you.</p><section id="reading" hidden><h2>Your Music Reading</h2><div id="cards"></div></section><section><h2>Chronological Collection</h2><div id="song-list"></div></section></main>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Keep the archive's existing collection in one place while adding the controls.
    const source = 'https://raw.githubusercontent.com/thezeusest/RIZNEY/9f0a54c2fd4b703e217b4beb59fe50d40ab00fcf/index.html';
    const nowPlaying=document.querySelector('#now-playing'), list=document.querySelector('#song-list'), reading=document.querySelector('#reading'), cards=document.querySelector('#cards');
    const previousButton=document.querySelector('#previous-song'), nextButton=document.querySelector('#next-song');
    let ids=[], player=null, apiReady=false, currentIndex=0, cardPlaylist=null, cardPosition=0;
    const titleFor=i=>`Song ${i+1}`;
    function updateSkipButtons(){previousButton.disabled=currentIndex<=0;nextButton.disabled=currentIndex>=ids.length-1}
    function play(index, autoplay=true){if(!ids[index])return;currentIndex=index;cardPlaylist=null;cardPosition=0;nowPlaying.textContent=`Now playing: ${titleFor(index)}`;updateSkipButtons();if(!player)return;(autoplay?player.loadVideoById:player.cueVideoById).call(player,{videoId:ids[index]});window.scrollTo({top:0,behavior:'smooth'})}
    function playNext(){if(cardPlaylist){if(cardPosition+1<cardPlaylist.length){cardPosition++;const i=cardPlaylist[cardPosition];currentIndex=i;nowPlaying.textContent=`Reading ${cardPosition+1} of ${cardPlaylist.length}: ${titleFor(i)}`;player.loadVideoById({videoId:ids[i]});updateSkipButtons();return}cardPlaylist=null;cardPosition=0;nowPlaying.textContent='Music reading complete ✦';return}if(currentIndex+1<ids.length)play(currentIndex+1);else nowPlaying.textContent='You reached the end of the collection ✦'}
    function playPrevious(){if(cardPlaylist&&cardPosition>0){cardPosition--;const i=cardPlaylist[cardPosition];currentIndex=i;nowPlaying.textContent=`Reading ${cardPosition+1} of ${cardPlaylist.length}: ${titleFor(i)}`;player.loadVideoById({videoId:ids[i]});updateSkipButtons();return}if(currentIndex>0)play(currentIndex-1)}
    function initPlayer(){if(!apiReady||!ids.length||player)return;player=new YT.Player('player',{videoId:ids[0],playerVars:{autoplay:0,rel:0,modestbranding:1,playsinline:1},events:{onReady:()=>{nowPlaying.textContent='Now playing: Song 1';updateSkipButtons()},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)playNext()}}})}
    window.onYouTubeIframeAPIReady=()=>{apiReady=true;initPlayer()};
    fetch(source).then(r=>r.text()).then(html=>{const matches=html.match(/https:\/\/(?:www\.)?(?:youtube\.com\/(?:shorts\/|watch\?v=)|youtu\.be\/)[^'"\\\s]+/g)||[];ids=matches.map(url=>url.match(/(?:youtu\.be\/|shorts\/|watch\?v=)([^?&/]+)/)?.[1]).filter(Boolean);ids=[...new Set(ids)];ids.forEach((id,i)=>{const row=document.createElement('article');row.className='song';row.innerHTML=`<span class="song-number">${i+1}</span><span class="song-title">♫ ${titleFor(i)}<small>YouTube video • chronological position ${i+1}</small></span><button class="play" type="button">Play</button>`;row.querySelector('button').onclick=()=>play(i);list.appendChild(row)});updateSkipButtons();initPlayer()}).catch(()=>{list.innerHTML='<p class="empty">Unable to load the collection.</p>'});
    previousButton.onclick=playPrevious;nextButton.onclick=playNext;
    document.querySelector('#random-song').onclick=()=>{if(!ids.length)return;play(Math.floor(Math.random()*ids.length))};
    document.querySelector('#draw-cards').onclick=()=>{if(!ids.length)return;cardPlaylist=[...ids.keys()].sort(()=>Math.random()-.5).slice(0,Math.min(5,ids.length));cardPosition=0;cards.innerHTML='';const symbols=['☾','✦','☉','♢','✧'];cardPlaylist.forEach((index,pos)=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<span class="symbol">${symbols[pos]}</span><strong>${titleFor(index)}</strong><a href="#" aria-label="Play ${titleFor(index)}">Reveal &amp; play</a>`;card.querySelector('a').onclick=e=>{e.preventDefault();cardPosition=pos;currentIndex=index;nowPlaying.textContent=`Reading ${pos+1} of ${cardPlaylist.length}: ${titleFor(index)}`;if(player)player.loadVideoById({videoId:ids[index]});updateSkipButtons();window.scrollTo({top:0,behavior:'smooth'})};cards.appendChild(card)});reading.hidden=false;const first=cardPlaylist[0];currentIndex=first;nowPlaying.textContent=`Reading 1 of ${cardPlaylist.length}: ${titleFor(first)}`;if(player)player.loadVideoById({videoId:ids[first]});updateSkipButtons();reading.scrollIntoView({behavior:'smooth'})};
  </script>
</body>
</html>
