<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rizney Music Archive</title>
  <style>
    :root {
      --black: #000;
      --panel: #120b18;
      --purple: #c084fc;
      --bright-purple: #e0aaff;
      --gold: #d4af37;
      --bright-gold: #f5d76e;
      --muted: #b9a8c5;
      --danger: #ff5b5b;
      --darker: #090509;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--black);
      color: var(--purple);
      font-family: Georgia, "Times New Roman", serif;
    }

    .top-area {
      position: relative;
      padding: 12px 14px 18px;
      text-align: center;
      background: #000;
    }

    .top-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    .donate,
    button {
      border: 1px solid var(--gold);
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
    }

    .donate {
      background: #160c1c;
      color: var(--bright-gold);
      padding: 5px 9px;
      text-decoration: none;
      font-size: .68rem;
      display: inline-block;
    }

    .donate:hover,
    button:hover {
      background: #7e35bc;
    }

    .whack-button {
      background: #55208a;
      color: #fff;
      padding: 6px 10px;
      font-size: .68rem;
      box-shadow: 0 0 12px rgba(212, 175, 55, .14);
    }

    h1 {
      margin: 4px 0 0;
      color: var(--bright-gold);
      letter-spacing: .08em;
      font-size: 1.55rem;
    }

    .tagline {
      margin-top: 6px;
      color: var(--muted);
      font-size: .78rem;
    }

    .player-dock {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0, 0, 0, .98);
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      box-shadow: 0 7px 28px rgba(0,0,0,.9), 0 2px 18px rgba(212,175,55,.18);
    }

    .player-wrap {
      width: 100%;
      max-width: 720px;
      margin: auto;
      aspect-ratio: 16 / 9;
      background: #090509;
    }

    #player {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #now-playing {
      padding: 7px 10px 8px;
      text-align: center;
      color: var(--bright-purple);
      background: #050305;
      font-size: .85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 10px 8px 12px;
      background: #000;
      border-bottom: 1px solid #3b1d50;
    }

    button {
      background: #55208a;
      color: #fff;
      padding: 9px 12px;
      font-size: .82rem;
    }

    .skip { min-width: 86px; }
    .skip[disabled] {
      opacity: .45;
      cursor: not-allowed;
    }

    main {
      width: min(100% - 24px, 900px);
      margin: 0 auto;
      padding: 18px 0 50px;
    }

    .intro {
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }

    h2 {
      color: var(--bright-gold);
      font-size: 1.25rem;
      border-bottom: 1px solid var(--gold);
      padding-bottom: 8px;
    }

    #song-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .song {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      color: var(--purple);
      background: var(--panel);
      border: 1px solid #3b1d50;
      border-radius: 8px;
    }

    .song-number {
      color: var(--gold);
      text-align: center;
    }

    .song-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .song small {
      display: block;
      color: var(--muted);
      font-family: sans-serif;
      font-size: .7rem;
      margin-top: 3px;
    }

    .play {
      padding: 7px 10px;
      font-size: .78rem;
    }

    .whack-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 18px;
    }

    .whack-modal.hidden { display: none; }

    .whack-panel {
      width: min(92vw, 760px);
      max-height: 88vh;
      overflow: auto;
      background: linear-gradient(180deg, #1c1028, #090509);
      border: 2px solid var(--gold);
      border-radius: 18px;
      box-shadow: 0 0 28px rgba(212,175,55,.2);
      padding: 18px 18px 16px;
      color: var(--bright-purple);
    }

    .whack-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(212,175,55,.4);
      padding-bottom: 12px;
    }

    .whack-header h3 {
      margin: 0;
      color: var(--bright-gold);
      font-size: clamp(1.1rem, 2vw, 1.7rem);
      letter-spacing: .06em;
    }

    .whack-close {
      background: #160c1c;
      color: var(--bright-gold);
      border: 1px solid var(--gold);
      padding: 7px 10px;
      font-size: .76rem;
    }

    .whack-status-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    #whack-song-name {
      color: var(--bright-gold);
      font-size: .9rem;
      letter-spacing: .04em;
    }

    #whack-health-text {
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .health-wrap {
      width: 100%;
      height: 18px;
      border: 2px solid var(--gold);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: inset 0 0 12px rgba(0,0,0,.5);
    }

    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #4ade80 0%, #facc15 50%, #ef4444 100%);
      transition: width .15s ease;
      border-radius: 999px;
    }

    .whack-message {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      text-align: center;
      color: var(--bright-gold);
      font-size: .98rem;
      line-height: 1.5;
      white-space: pre-line;
      letter-spacing: .04em;
      font-weight: 700;
    }

    .whack-message.survived { color: var(--bright-purple); }

    .whack-moles {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 12px;
      margin: 12px 0 16px;
    }

    .mole-hole {
      position: relative;
      min-height: 110px;
      border-radius: 18px;
      border: 3px solid rgba(212,175,55,.8);
      background: linear-gradient(180deg, #1d1028, #090509);
      overflow: hidden;
      padding: 0;
      cursor: pointer;
    }

    .mole-hole::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 0;
      height: 22%;
      background: rgba(0,0,0,.28);
      border-radius: 12px 12px 0 0;
    }

    .mole {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translate(-50%, 65%) scale(.7);
      opacity: 0;
      pointer-events: none;
      width: 80%;
      min-height: 54px;
      border: 4px solid #000;
      background: linear-gradient(180deg, #ffdb80, #d39c25);
      color: #000;
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .12em;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 0 0 4px #7a4d14, 0 8px 0 rgba(0,0,0,.2);
      border-radius: 8px;
      font-family: "Courier New", monospace;
      transition: transform .12s ease, opacity .12s ease;
    }

    .mole-hole.active .mole {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .whack-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .whack-restore,
    .whack-stop {
      background: #160c1c;
      color: var(--bright-gold);
      border: 1px solid var(--gold);
      padding: 8px 12px;
      font-size: .76rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 500px) {
      .top-area { padding-top: 42px; }
      .top-actions { top: 8px; right: 8px; }
      .donate { top: 8px; left: 8px; }
      h1 { font-size: 1.35rem; }
      .player-wrap { aspect-ratio: 16 / 9; }
      button { font-size: .75rem; padding: 8px 10px; }
      .skip { min-width: 0; }
      .whack-panel { padding: 14px 12px 12px; }
      .whack-moles { grid-template-columns: repeat(2, minmax(90px, 1fr)); }
    }
  </style>
</head>
<body>
  <section class="top-area">
    <div class="top-actions">
      <a class="donate" href="https://venmo.com/u/YOUR_VENMO_USERNAME" target="_blank" rel="noopener">♥ Donate</a>
      <button id="whack-button" class="whack-button" type="button">🎵 WHACK-A-TRACK!</button>
    </div>

    <h1>✦ WALT RIZNEY ✦</h1>
    <div class="tagline">Mix'N'Mojo</div>
  </section>

  <section class="player-dock">
    <div class="player-wrap">
      <div id="player"></div>
    </div>
    <div id="now-playing">Now playing: Song 1</div>
  </section>

  <nav class="controls" aria-label="Music controls">
    <button id="previous-song" class="skip" type="button">« Previous</button>
    <button id="random-song" type="button">♫ Random</button>
    <button id="next-song" class="skip" type="button">Next »</button>
  </nav>

  <main>
    <p class="intro">Browse the collection in order, or let the music choose the next one.</p>
    <section>
      <h2>Chronological Collection</h2>
      <div id="song-list"></div>
    </section>
  </main>

  <div id="whack-modal" class="whack-modal hidden" aria-hidden="true">
    <div class="whack-panel" role="dialog" aria-modal="true" aria-labelledby="whack-title">
      <div class="whack-header">
        <h3 id="whack-title">🎵 WHACK-A-TRACK!</h3>
        <button id="whack-close" class="whack-close" type="button">Return to Music Site</button>
      </div>

      <div id="whack-game">
        <div class="whack-status-row">
          <div id="whack-song-name">Song 1</div>
          <div id="whack-health-text">Health</div>
        </div>

        <div class="health-wrap" aria-label="Song health">
          <div id="health-fill" class="health-fill"></div>
        </div>

        <div id="whack-message" class="whack-message">Ready to whack!</div>

        <div id="whack-moles" class="whack-moles" aria-label="Whack game board">
          <button class="mole-hole" type="button" aria-label="Hole 1"><span class="mole">8-BIT</span></button>
          <button class="mole-hole" type="button" aria-label="Hole 2"><span class="mole">8-BIT</span></button>
          <button class="mole-hole" type="button" aria-label="Hole 3"><span class="mole">8-BIT</span></button>
          <button class="mole-hole" type="button" aria-label="Hole 4"><span class="mole">8-BIT</span></button>
          <button class="mole-hole" type="button" aria-label="Hole 5"><span class="mole">8-BIT</span></button>
          <button class="mole-hole" type="button" aria-label="Hole 6"><span class="mole">8-BIT</span></button>
          <button class="mole-hole" type="button" aria-label="Hole 7"><span class="mole">8-BIT</span></button>
          <button class="mole-hole" type="button" aria-label="Hole 8"><span class="mole">8-BIT</span></button>
          <button class="mole-hole" type="button" aria-label="Hole 9"><span class="mole">8-BIT</span></button>
        </div>

        <div class="whack-actions">
          <button id="restore-destroyed" class="whack-restore" type="button">Restore Destroyed Songs</button>
          <button id="whack-stop" class="whack-stop" type="button">Stop Game</button>
        </div>
      </div>
    </div>
  </div>

      'https://youtu.be/6jRDo2q6Dtg',
      'https://youtu.be/EfLMAfxEc7A',
      'https://youtu.be/bdext1tW3YM',
      'https://youtu.be/LhEAe8tuS18',
      'https://youtu.be/BrccqDo-qxw',
      'https://youtu.be/GCPGxDdpugE',
      'https://youtu.be/5RVldUp7n_c',
      'https://youtu.be/x7Edg_aqeaU',
      'https://youtu.be/FigWQ4xaWoc',
      'https://youtu.be/8koRvyJpZuw',
      'https://youtu.be/50qPRfx1uc0',
      'https://youtu.be/Kg8nSXhgjdk',
      'https://youtu.be/jgSv8g5bxT8'
    ];

    const ids = songs.map(url => url.match(/(?:youtu\.be\/|shorts\/|watch\?v=)([^?&/]+)/)?.[1]).filter(Boolean);

    const nowPlaying = document.querySelector('#now-playing');
    const list = document.querySelector('#song-list');
    const previousButton = document.querySelector('#previous-song');
    const nextButton = document.querySelector('#next-song');
    const randomButton = document.querySelector('#random-song');
    const whackButton = document.querySelector('#whack-button');
    const whackModal = document.querySelector('#whack-modal');
    const whackClose = document.querySelector('#whack-close');
    const whackStop = document.querySelector('#whack-stop');
    const restoreDestroyedButton = document.querySelector('#restore-destroyed');
    const whackSongName = document.querySelector('#whack-song-name');
    const whackHealthText = document.querySelector('#whack-health-text');
    const healthFill = document.querySelector('#health-fill');
    const whackMessage = document.querySelector('#whack-message');

    let player = null;
    let currentIndex = 0;
    let gameState = null;
    let whackTimers = [];
    let destroyedSongs = [];

    function loadDestroyedSongs() {
      try {
        const saved = JSON.parse(localStorage.getItem('rizneyDestroyedSongs') || '[]');
        destroyedSongs = Array.isArray(saved) ? saved : [];
      } catch {
        destroyedSongs = [];
      }
    }

    function saveDestroyedSongs() {
      localStorage.setItem('rizneyDestroyedSongs', JSON.stringify(destroyedSongs));
    }

    function titleFor(index) {
      return `Song ${index + 1}`;
    }

    function updateButtons() {
      previousButton.disabled = currentIndex <= 0;
      nextButton.disabled = currentIndex >= ids.length - 1;
    }

    function isDestroyed(index) {
      return destroyedSongs.includes(String(index));
    }

    function play(index, autoplay = true) {
      if (!ids[index]) return;
      currentIndex = index;
      nowPlaying.textContent = `Now playing: ${titleFor(index)}`;

      if (!player) return;
      if (autoplay) player.loadVideoById({ videoId: ids[index] });
      else player.cueVideoById({ videoId: ids[index] });

      updateButtons();
    }

    function prev() {
      if (currentIndex > 0) play(currentIndex - 1);
    }

    function next() {
      if (currentIndex < ids.length - 1) play(currentIndex + 1);
    }

    function randomSong() {
      if (ids.length <= 1) return;
      let nextIndex = currentIndex;
      while (nextIndex === currentIndex) {
        nextIndex = Math.floor(Math.random() * ids.length);
      }
      play(nextIndex);
    }

    function renderList() {
      list.innerHTML = '';
      ids.forEach((id, index) => {
        const row = document.createElement('article');
        row.className = 'song';
        row.innerHTML = `
          <div class="song-number">${index + 1}</div>
          <div class="song-title">
            ${titleFor(index)}
            <small>YouTube video • chronological position ${index + 1}</small>
          </div>
          <button class="play" type="button">Play</button>
        `;

        const playButton = row.querySelector('.play');
        playButton.addEventListener('click', () => play(index));
        row.addEventListener('dblclick', () => play(index));
        row.style.opacity = isDestroyed(index) ? '.45' : '1';
        list.appendChild(row);
      });
    }

    function stopWhackMoles() {
      whackTimers.forEach(timer => clearTimeout(timer));
      whackTimers = [];
      document.querySelectorAll('.mole-hole').forEach((hole) => {
        hole.classList.remove('active');
        const mole = hole.querySelector('.mole');
        if (mole) mole.textContent = '8-BIT';
      });
    }

    function updateHealthDisplay() {
      if (!gameState) {
        healthFill.style.width = '100%';
        whackHealthText.textContent = 'Health';
        return;
      }

      const pct = Math.max(0, Math.min(100, gameState.health));
      healthFill.style.width = pct + '%';
      whackHealthText.textContent = `Health ${Math.round(pct)}%`;
    }

    function closeWhackModal() {
      stopWhackMoles();
      if (gameState && gameState.status === 'playing') {
        gameState.status = 'ended';
      }
      gameState = null;
      whackModal.classList.add('hidden');
      whackModal.setAttribute('aria-hidden', 'true');
      if (player && typeof player.stopVideo === 'function') {
        player.stopVideo();
      }
    }

    function openWhackModal() {
      if (isDestroyed(currentIndex)) {
        whackMessage.textContent = `Song ${currentIndex + 1} was already destroyed in this browser.\nRestore destroyed songs to keep going.`;
        whackMessage.classList.add('survived');
      } else {
        whackMessage.textContent = 'Ready to whack!';
        whackMessage.classList.remove('survived');
      }

      whackSongName.textContent = titleFor(currentIndex);
      whackModal.classList.remove('hidden');
      whackModal.setAttribute('aria-hidden', 'false');
      startWhackGame();
    }

    function startWhackGame() {
      if (isDestroyed(currentIndex)) return;

      gameState = {
        activeIndex: currentIndex,
        health: 100,
        status: 'playing'
      };

      whackSongName.textContent = titleFor(currentIndex);
      updateHealthDisplay();
      whackMessage.textContent = 'WHACK!';
      whackMessage.classList.remove('survived');
      spawnMoleWave();
    }

    function maybeLoseHealth(damage) {
      if (!gameState || gameState.status !== 'playing') return;
      gameState.health = Math.max(0, gameState.health - damage);
      updateHealthDisplay();

      if (gameState.health <= 0) {
        destroyCurrentSong();
      }
    }

    function destroyCurrentSong() {
      if (!gameState || gameState.status !== 'playing') return;
      gameState.status = 'destroyed';
      stopWhackMoles();

      if (!destroyedSongs.includes(String(currentIndex))) {
        destroyedSongs.push(String(currentIndex));
        saveDestroyedSongs();
      }

      whackMessage.textContent = 'SONG IS DESTROYED!\nThe track is gone for this browser.';
      whackMessage.classList.remove('survived');

      if (player && typeof player.stopVideo === 'function') {
        player.stopVideo();
      }

      setTimeout(() => {
        whackModal.classList.add('hidden');
        whackModal.setAttribute('aria-hidden', 'true');
        whackMessage.textContent = 'Ready to whack!';
        renderList();
      }, 1200);
    }

    function spawnMoleWave() {
      if (!gameState || gameState.status !== 'playing') return;

      const holes = Array.from(document.querySelectorAll('.mole-hole'));
      const activeCount = 1 + Math.floor(Math.random() * 2); // 1-2 moles at a time
      const randomHoles = [...holes].sort(() => Math.random() - 0.5).slice(0, activeCount);

      randomHoles.forEach((hole, idx) => {
        const mole = hole.querySelector('.mole');
        hole.classList.add('active');
        mole.textContent = '8-BIT';

        const timeout = setTimeout(() => {
          hole.classList.remove('active');
          mole.textContent = '8-BIT';
        }, 200 + Math.random() * 140 + idx * 25);

        whackTimers.push(timeout);
      });

      const nextDelay = 330 + Math.random() * 260;
      const loop = setTimeout(() => {
        spawnMoleWave();
      }, nextDelay);
      whackTimers.push(loop);
    }

    function handleWhackHit(event) {
      const hole = event.currentTarget;
      if (!gameState || gameState.status !== 'playing') return;
      if (!hole.classList.contains('active')) {
        maybeLoseHealth(10);
        whackMessage.textContent = 'MISS!\nToo slow.';
        return;
      }

      const mole = hole.querySelector('.mole');
      if (mole) mole.textContent = 'BAM!';
      hole.classList.remove('active');

      const successHit = Math.random() < 0.9;
      if (successHit) {
        whackMessage.textContent = 'GOOD HIT!\nKeep going.';
        maybeLoseHealth(18);
      } else {
        whackMessage.textContent = 'CLOSE!\nThe song fights back.';
        maybeLoseHealth(24);
      }
    }

    function restoreDestroyedSongs() {
      destroyedSongs = [];
      saveDestroyedSongs();
      renderList();
      whackMessage.textContent = 'Destroyed songs restored.';
      whackMessage.classList.add('survived');
      setTimeout(() => {
        if (gameState && gameState.status === 'destroyed') {
          whackMessage.textContent = 'Ready to whack!';
          whackMessage.classList.remove('survived');
        }
      }, 900);
    }

    function setupWhackGame() {
      document.querySelectorAll('.mole-hole').forEach((hole) => {
        hole.addEventListener('click', handleWhackHit);
      });

      whackButton.addEventListener('click', openWhackModal);
      whackClose.addEventListener('click', closeWhackModal);
      whackStop.addEventListener('click', () => {
        stopWhackMoles();
        gameState = null;
        whackModal.classList.add('hidden');
        whackModal.setAttribute('aria-hidden', 'true');
        whackMessage.textContent = 'Ready to whack!';
      });
      restoreDestroyedButton.addEventListener('click', restoreDestroyedSongs);
    }

    function buildSongList() {
      list.innerHTML = '';
      ids.forEach((id, index) => {
        const row = document.createElement('article');
        row.className = 'song';
        row.innerHTML = `
          <div class="song-number">${index + 1}</div>
          <div class="song-title">
            ${titleFor(index)}
            <small>YouTube video • position ${index + 1}</small>
          </div>
          <button class="play" type="button">Play</button>
        `;

        const playButton = row.querySelector('.play');
        playButton.addEventListener('click', () => play(index));
        row.style.opacity = isDestroyed(index) ? '.4' : '1';
        list.appendChild(row);
      });
    }

    previousButton.addEventListener('click', prev);
    nextButton.addEventListener('click', next);
    randomButton.addEventListener('click', randomSong);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        videoId: ids[0],
        playerVars: { autoplay: 0, rel: 0, modestbranding: 1, playsinline: 1 },
        events: {
          onReady: () => {
            loadDestroyedSongs();
            buildSongList();
            updateButtons();
            nowPlaying.textContent = `Now playing: ${titleFor(0)}`;
            setupWhackGame();
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED) {
              if (gameState && gameState.status === 'playing') {
                destroyCurrentSong();
              } else {
                next();
              }
            }
          }
        }
      });
    };
  </script>
</body>
</html>
