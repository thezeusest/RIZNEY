<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rizney Music Archive</title>
  <style>
    :root{--black:#000;--panel:#120b18;--purple:#c084fc;--bright-purple:#e0aaff;--gold:#d4af37;--bright-gold:#f5d76e;--muted:#b9a8c5}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--purple);background:var(--black);font-family:Georgia,"Times New Roman",serif}
    .top-area{position:relative;padding:10px 14px 18px;text-align:center}.donate{position:absolute;top:10px;left:10px;border:1px solid var(--gold);border-radius:999px;padding:5px 9px;color:var(--bright-gold);background:#160c1c;font-size:.68rem;text-decoration:none}.donate:hover{background:#55208a}h1{margin:4px 0 0;color:var(--bright-gold);font-size:1.5rem;letter-spacing:.08em}.tagline{margin-top:6px;color:var(--muted);font-size:.78rem}
    .player-dock{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.98);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);box-shadow:0 7px 28px rgba(0,0,0,.9),0 2px 18px rgba(212,175,55,.18)}.player-wrap{width:100%;max-width:620px;margin:auto;aspect-ratio:16/9;background:#090509}.player-wrap iframe{width:100%;height:100%;border:0;display:block}#player{width:100%;height:100%}#now-playing{padding:7px 10px 8px;color:var(--bright-purple);background:#050305;font-size:.85rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 8px 12px;background:#000;border-bottom:1px solid #3b1d50}button{border:1px solid var(--gold);border-radius:999px;padding:9px 12px;color:#fff;background:#55208a;font:inherit;font-size:.82rem;cursor:pointer}button:hover{background:#7e35b7}button:active{transform:translateY(1px)}button:focus-visible{outline:2px solid var(--bright-gold);outline-offset:2px}.skip{min-width:42px;width:42px;height:38px;padding:0;font-size:1.2rem}.skip[disabled]{opacity:.45;cursor:not-allowed}
    main{width:min(100% - 24px,900px);margin:0 auto;padding:18px 0 50px}.intro{color:var(--muted);text-align:center;line-height:1.45}h2{color:var(--bright-gold);font-size:1.25rem;border-bottom:1px solid var(--gold);padding-bottom:8px}#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0 22px}.card{min-height:150px;padding:9px 6px;color:var(--bright-purple);background:linear-gradient(145deg,#21102e,#090509);border:2px solid var(--gold);border-radius:12px;text-align:center}.card .symbol{display:block;color:var(--bright-gold);font-size:1.7rem;margin-bottom:6px}.card strong{display:block;margin-bottom:8px;font-size:.78rem}.card a{color:var(--bright-gold);font-size:.7rem}.card button{padding:7px 10px;font-size:.78rem}.song-list{display:grid;gap:8px}.song{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:10px;color:var(--bright-purple);background:var(--panel);border:1px solid #3b1d50;border-radius:8px}.song-number{color:var(--gold);text-align:center}.song-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song-title small{display:block;color:var(--muted);font-family:sans-serif;font-size:.7rem;margin-top:3px}.play{padding:7px 10px;font-size:.78rem}
    @media(max-width:500px){.top-area{padding-top:42px}.donate{top:8px;left:8px}h1{font-size:1.35rem}.controls{gap:6px}button{font-size:.75rem;padding:8px 10px}.skip{width:38px;min-width:38px;height:34px}.card{min-height:130px}.card strong{font-size:.7rem}.song{grid-template-columns:30px 1fr auto}.song-title{font-size:.82rem}}
  </style>
</head>
<body>
  <section class="top-area"><a class="donate" href="https://venmo.com/u/YOUR_VENMO_USERNAME" target="_blank" rel="noopener">♥ Donate</a><h1>✦ WALT RIZNEY ✦</h1><div class="tagline">Mix'N'Mojo</div></section>
  <section class="player-dock"><div class="player-wrap"><div id="player"></div></div><div id="now-playing">Now playing: Mega MIX'N'MOJO Intro</div></section>
  <nav class="controls" aria-label="Music controls">
    <button id="previous-song" class="skip" type="button" aria-label="Previous song">«</button>
    <button id="random-song" type="button">♫ Random</button>
    <button id="whack-track" type="button">🎯 Whack-a-Track</button>
    <button id="draw-cards" type="button">✦ Draw Six</button>
    <button id="next-song" class="skip" type="button" aria-label="Next song">»</button>
  </nav>
  <main><p class="intro">Browse the collection in order, or let the cards choose a song for you.</p><section id="reading" hidden><h2>Your Music Reading</h2><div id="cards"></div></section><section><h2>Chronological Collection</h2><div id="song-list" class="song-list"></div></section></main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const source='https://raw.githubusercontent.com/thezeusest/RIZNEY/5449f0ee0a83694f282620fe8d3b39b8bac077c7/index.html';
    const $=s=>document.querySelector(s),nowPlaying=$('#now-playing'),list=$('#song-list'),cards=$('#cards'),reading=$('#reading'),previousButton=$('#previous-song'),nextButton=$('#next-song'),randomButton=$('#random-song');
    let ids=[],player=null,apiReady=false,currentIndex=0,cardPlaylist=null,cardPosition=0;
    const titleFor=i=>`Song ${i+1}`;
    function updateButtons(){previousButton.disabled=cardPlaylist===null?currentIndex<=0:cardPosition<=0;nextButton.disabled=cardPlaylist===null?currentIndex>=ids.length-1:cardPosition>=cardPlaylist.length-1}
    function play(index,autoplay=true){if(!ids[index])return;currentIndex=index;nowPlaying.textContent=`Now playing: ${titleFor(index)}`;if(player)(autoplay?player.loadVideoById:player.cueVideoById).call(player,{videoId:ids[index]});updateButtons();window.scrollTo({top:0,behavior:'smooth'})}
    function playPosition(position){if(!cardPlaylist||cardPlaylist[position]===undefined)return;cardPosition=position;currentIndex=cardPlaylist[position];nowPlaying.textContent=`Reading ${position+1} of ${cardPlaylist.length}: ${titleFor(currentIndex)}`;if(player)player.loadVideoById({videoId:ids[currentIndex]});updateButtons();window.scrollTo({top:0,behavior:'smooth'})}
    function next(){if(cardPlaylist!==null){if(cardPosition<cardPlaylist.length-1)return playPosition(cardPosition+1);cardPlaylist=null;cardPosition=0;nowPlaying.textContent='Music reading complete ✦';return updateButtons()}if(currentIndex<ids.length-1)play(currentIndex+1);else nowPlaying.textContent='You reached the end of the collection ✦'}
    function previous(){if(cardPlaylist!==null)return cardPosition>0&&playPosition(cardPosition-1);if(currentIndex>0)play(currentIndex-1)}
    function initPlayer(){if(!apiReady||!ids.length||player)return;player=new YT.Player('player',{videoId:ids[0],playerVars:{autoplay:0,rel:0,modestbranding:1,playsinline:1},events:{onReady:updateButtons,onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)next()}}});window.rizneyPlayer=player}
    function removeWhackedTrack(){if(!ids.length)return;const removedIndex=currentIndex;ids.splice(removedIndex,1);cardPlaylist=null;cardPosition=0;build();if(!ids.length){nowPlaying.textContent='The playlist is empty ✦';updateButtons();return}currentIndex=Math.min(removedIndex,ids.length-1);play(currentIndex);}
    window.addEventListener('rizney:track-whacked',removeWhackedTrack);
    window.onYouTubeIframeAPIReady=()=>{apiReady=true;initPlayer()};previousButton.onclick=previous;nextButton.onclick=next;
    randomButton.onclick=()=>{cardPlaylist=null;cardPosition=0;if(ids.length)play(Math.floor(Math.random()*ids.length))};
    $('#draw-cards').onclick=()=>{if(!ids.length)return;cardPlaylist=[...ids.keys()].sort(()=>Math.random()-.5).slice(0,Math.min(6,ids.length));cardPosition=0;reading.hidden=false;cards.innerHTML='';['☀','☾','★','✦','♢','♧'].slice(0,cardPlaylist.length).forEach((symbol,p)=>{const index=cardPlaylist[p],card=document.createElement('article');card.className='card';card.innerHTML=`<span class="symbol">${symbol}</span><strong>Reading ${p+1}</strong><a href="#">Play song ${index+1}</a>`;card.querySelector('a').onclick=e=>{e.preventDefault();playPosition(p)};cards.appendChild(card)});updateButtons()};
    function build(){list.innerHTML='';ids.forEach((id,index)=>{const row=document.createElement('article');row.className='song';row.innerHTML=`<span class="song-number">${index+1}</span><span class="song-title">♫ ${titleFor(index)}<small>YouTube video · chronological position ${index+1}</small></span><button class="play" type="button">Play</button>`;row.querySelector('button').onclick=()=>{cardPlaylist=null;cardPosition=0;play(index)};list.appendChild(row)});updateButtons()}
    fetch(source).then(r=>r.text()).then(html=>{const urls=html.match(/https:\/\/(?:www\.)?(?:youtube\.com\/(?:shorts\/|watch\?v=)|youtu\.be\/)[^'"\s]+/g)||[];ids=[...new Set(urls.map(u=>u.match(/(?:youtu\.be\/|shorts\/|watch\?v=)([^?&/]+)/)?.[1]).filter(Boolean))];build();initPlayer()}).catch(()=>{nowPlaying.textContent='The playlist could not be loaded.'});
  </script>
  <script src="./whack-a-track.js"></script>
</body>
</html>
