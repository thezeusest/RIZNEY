<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rizney Music Archive</title>
  <style>
    :root{--black:#000;--panel:#120b18;--purple:#c084fc;--bright-purple:#e0aaff;--gold:#d4af37;--bright-gold:#f5d76e;--muted:#b9a8c5}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--purple);background:var(--black);font-family:Georgia,"Times New Roman",serif}
    .top-area{position:relative;padding:10px 14px 18px;text-align:center}.donate{position:absolute;top:10px;left:10px;border:1px solid var(--gold);border-radius:999px;padding:5px 9px;color:var(--bright-gold);background:#160c1c;font-size:.68rem;text-decoration:none;z-index:5}.donate:hover{background:#55208a}h1{margin:4px 0 0;color:var(--bright-gold);font-size:1.55rem;letter-spacing:.08em}.tagline{margin-top:6px;color:var(--muted);font-size:.78rem}
    .player-dock{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.98);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);box-shadow:0 7px 28px rgba(0,0,0,.9),0 2px 18px rgba(212,175,55,.18)}.player-wrap{width:100%;max-width:720px;margin:auto;aspect-ratio:16/9;background:#090509}#player{width:100%;height:100%;border:0;display:block}#now-playing{padding:7px 10px 8px;color:var(--bright-purple);background:#050305;font-size:.85rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 8px 12px;background:#000;border-bottom:1px solid #3b1d50}button{border:1px solid var(--gold);border-radius:999px;padding:9px 12px;color:#fff;background:#55208a;font:inherit;font-size:.82rem;cursor:pointer;transition:background-color .18s ease,transform .12s ease}button:hover{background:#7e35bc}button:active{transform:translateY(1px)}button:focus-visible{outline:2px solid var(--bright-gold);outline-offset:2px}.skip{min-width:42px;width:42px;height:38px;padding:0;font-size:1.2rem;font-weight:700}.skip:disabled{opacity:.45;cursor:not-allowed}
    .whack-menu{width:min(100%,620px);flex-basis:100%;padding:14px;margin:0 auto;border:1px solid var(--gold);border-radius:10px;background:#120b18;color:var(--bright-purple);text-align:center}.whack-menu[hidden]{display:none}.whack-menu p{margin:0 0 9px;color:var(--muted);font-size:.82rem}.whack-status{min-height:1.2em;margin-top:9px;color:var(--bright-gold);font-size:.8rem}.game-stats{display:flex;justify-content:center;gap:24px;margin:8px 0;color:var(--bright-gold);font-family:sans-serif;font-size:.8rem}.game-board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(100%,390px);margin:12px auto}.hole{position:relative;height:76px;padding:0;overflow:hidden;border:2px solid #8f6b20;border-radius:50%;background:radial-gradient(ellipse at center,#050305 0 42%,#3b1d50 44% 55%,#120b18 57%);cursor:crosshair}.hole:hover{background:radial-gradient(ellipse at center,#090509 0 42%,#7e35bc 44% 55%,#120b18 57%)}.mole{position:absolute;left:50%;bottom:-8px;width:42px;height:49px;padding:0;border:2px solid #8d5a32;border-radius:50% 50% 38% 38%;background:#9a633c;transform:translateX(-50%);font-size:1.2rem;line-height:1}.mole:hover{background:#b97a4e}.mole::before{content:'•  •';display:block;margin-top:12px;color:#20100b;font-size:1rem;letter-spacing:4px}.mole::after{content:'⌣';display:block;color:#20100b;font-size:.9rem}.mole[hidden]{display:none}
    main{width:min(100% - 24px,900px);margin:0 auto;padding:18px 0 50px}.intro{color:var(--muted);text-align:center;line-height:1.45}h2{color:var(--bright-gold);font-size:1.25rem;border-bottom:1px solid var(--gold);padding-bottom:8px}#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0 22px}.card{min-height:150px;padding:9px 6px;color:var(--bright-purple);background:linear-gradient(145deg,#21102e,#090509);border:2px solid var(--gold);border-radius:12px;box-shadow:inset 0 0 0 2px rgba(212,175,55,.15),0 0 14px rgba(212,175,55,.13);text-align:center}.card .symbol{display:block;color:var(--bright-gold);font-size:1.7rem;margin-bottom:6px}.card strong{display:block;margin-bottom:8px;font-size:.78rem}.card a{color:var(--bright-gold);font-size:.7rem}#song-list{display:grid;gap:8px}.song{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:10px;color:var(--purple);background:var(--panel);border:1px solid #3b1d50;border-radius:8px}.song-number{color:var(--gold);text-align:center}.song-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song small{display:block;color:var(--muted);font-family:sans-serif;font-size:.7rem;margin-top:3px}.play{padding:7px 10px;font-size:.78rem}
    @media(min-width:700px){.player-wrap{max-width:620px}.song{grid-template-columns:45px 1fr auto}}@media(max-width:500px){.top-area{padding-top:42px}.donate{top:8px;left:8px}h1{font-size:1.35rem}.controls{gap:6px}button{font-size:.75rem;padding:8px 10px}.skip{width:38px;min-width:38px;height:34px;font-size:1.05rem}.card{min-height:130px}.card .symbol{font-size:1.45rem}.hole{height:66px}}
  </style>
</head>
<body>
  <section class="top-area"><a class="donate" href="https://venmo.com/u/YOUR_VENMO_USERNAME" target="_blank" rel="noopener">♥ Donate</a><h1>✦ WALT RIZNEY ✦</h1><div class="tagline">Mix'N'Mojo</div></section>
  <section class="player-dock"><div class="player-wrap"><div id="player"></div></div><div id="now-playing">Now playing: Mega MIX'N'MOJO Intro</div></section>
  <nav class="controls" aria-label="Music controls">
    <button id="previous-song" class="skip" type="button" aria-label="Previous song">«</button>
    <button id="random-song" type="button">♫ Random</button>
    <button id="whack-track" type="button" aria-expanded="false" aria-controls="whack-menu">🎯 Whack-a-Track</button>
    <button id="draw-cards" type="button">✦ Draw Six</button>
    <button id="next-song" class="skip" type="button" aria-label="Next song">»</button>
    <div id="whack-menu" class="whack-menu" hidden>
      <p>Whack the mole before it disappears to play its track!</p>
      <div class="game-stats"><span>Score: <b id="whack-score">0</b></span><span>Time: <b id="whack-time">20</b></span></div>
      <div id="game-board" class="game-board" aria-label="Whack-a-Track game board"></div>
      <button id="whack-play" type="button">🎯 Start game</button>
      <div id="whack-status" class="whack-status" role="status" aria-live="polite">Ready when you are!</div>
    </div>
  </nav>
  <main>
    <p class="intro">Browse the collection in order, or let the cards choose a song for you.</p>
    <section id="reading" hidden><h2>Your Music Reading</h2><div id="cards"></div></section>
    <section><h2>Chronological Collection</h2><div id="song-list"></div></section>
  </main>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const source='https://raw.githubusercontent.com/thezeusest/RIZNEY/5449f0ee0a83694f282620fe8d3b39b8bac077c7/index.html';
    const nowPlaying=document.querySelector('#now-playing'),list=document.querySelector('#song-list'),cards=document.querySelector('#cards'),reading=document.querySelector('#reading');
    const previousButton=document.querySelector('#previous-song'),nextButton=document.querySelector('#next-song');
    const whackButton=document.querySelector('#whack-track'),whackMenu=document.querySelector('#whack-menu'),whackPlay=document.querySelector('#whack-play'),board=document.querySelector('#game-board'),scoreText=document.querySelector('#whack-score'),timeText=document.querySelector('#whack-time'),statusText=document.querySelector('#whack-status');
    let ids=[],player=null,apiReady=false,currentIndex=0,cardPlaylist=null,cardPosition=0,gameTimer=null,moleTimer=null,gameRunning=false,score=0,timeLeft=20;
    const titleFor=i=>`Song ${i+1}`;
    function updateButtons(){previousButton.disabled=cardPlaylist===null?currentIndex<=0:cardPosition<=0;nextButton.disabled=cardPlaylist===null?currentIndex>=ids.length-1:cardPosition>=cardPlaylist.length-1}
    function play(index,autoplay=true){if(!ids[index])return;currentIndex=index;nowPlaying.textContent=`Now playing: ${titleFor(index)}`;if(player)(autoplay?player.loadVideoById:player.cueVideoById).call(player,{videoId:ids[index]});updateButtons();window.scrollTo({top:0,behavior:'smooth'})}
    function playNext(){if(cardPlaylist!==null){if(cardPosition<cardPlaylist.length-1){playPlaylistPosition(cardPosition+1);return}cardPlaylist=null;cardPosition=0;nowPlaying.textContent='Music reading complete ✦';updateButtons();return}if(currentIndex<ids.length-1)play(currentIndex+1);else nowPlaying.textContent='You reached the end of the collection ✦';updateButtons()}
    function playPrevious(){if(cardPlaylist!==null){if(cardPosition>0)playPlaylistPosition(cardPosition-1);return}if(currentIndex>0)play(currentIndex-1)}
    function playPlaylistPosition(position){if(!cardPlaylist||cardPlaylist[position]===undefined)return;cardPosition=position;play(cardPlaylist[position]);nowPlaying.textContent=`Reading ${position+1} of ${cardPlaylist.length}: ${titleFor(currentIndex)}`}
    function initPlayer(){if(!apiReady||!ids.length||player)return;player=new YT.Player('player',{videoId:ids[0],playerVars:{autoplay:0,rel:0,modestbranding:1,playsinline:1},events:{onReady:()=>{nowPlaying.textContent='Now playing: Song 1';updateButtons()},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)playNext()}}})}
    window.onYouTubeIframeAPIReady=()=>{apiReady=true;initPlayer()};
    function showMole(){if(!gameRunning)return;document.querySelectorAll('.mole').forEach(m=>m.hidden=true);const hole=board.children[Math.floor(Math.random()*board.children.length)],mole=hole.querySelector('.mole');mole.dataset.songIndex=Math.floor(Math.random()*ids.length);mole.hidden=false}
    function endGame(){gameRunning=false;clearInterval(gameTimer);clearInterval(moleTimer);document.querySelectorAll('.mole').forEach(m=>m.hidden=true);whackPlay.textContent='🎯 Play again';statusText.textContent=`Game over! You scored ${score} point${score===1?'':'s'}.`;}
    function startGame(){if(!ids.length)return;clearInterval(gameTimer);clearInterval(moleTimer);score=0;timeLeft=20;gameRunning=true;scoreText.textContent=score;timeText.textContent=timeLeft;statusText.textContent='Whack the moles!';whackPlay.textContent='Restart game';showMole();moleTimer=setInterval(showMole,700);gameTimer=setInterval(()=>{timeLeft--;timeText.textContent=timeLeft;if(timeLeft<=0)endGame()},1000)}
    function buildGame(){board.innerHTML='';for(let i=0;i<9;i++){const hole=document.createElement('button');hole.className='hole';hole.type='button';hole.setAttribute('aria-label',`Hole ${i+1}`);hole.innerHTML='<span class="mole" hidden aria-label="Mole">🐭</span>';hole.addEventListener('click',e=>{const mole=e.currentTarget.querySelector('.mole');if(!gameRunning||mole.hidden)return;score++;scoreText.textContent=score;play(Number(mole.dataset.songIndex));mole.hidden=true;statusText.textContent=`Nice hit! ${titleFor(currentIndex)} is playing.`;showMole()});board.appendChild(hole)}}
    whackButton.addEventListener('click',()=>{const open=whackMenu.hidden;whackMenu.hidden=!open;whackButton.setAttribute('aria-expanded',String(open));if(open)whackPlay.focus()});whackPlay.addEventListener('click',startGame);previousButton.addEventListener('click',playPrevious);nextButton.addEventListener('click',playNext);
    document.querySelector('#random-song').addEventListener('click',()=>{cardPlaylist=null;cardPosition=0;if(ids.length)play(Math.floor(Math.random()*ids.length))});
    document.querySelector('#draw-cards').addEventListener('click',()=>{if(!ids.length)return;cardPlaylist=[...ids.keys()].sort(()=>Math.random()-.5).slice(0,Math.min(6,ids.length));cardPosition=0;reading.hidden=false;cards.innerHTML='';const symbols=['✦','✧','✩','✹','✺','✷'];cardPlaylist.forEach((index,pos)=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<span class="symbol">${symbols[pos]}</span><strong>Reading ${pos+1}</strong><a href="#">Play song ${index+1}</a>`;card.querySelector('a').onclick=e=>{e.preventDefault();playPlaylistPosition(pos)};cards.appendChild(card)})});
    fetch(source).then(r=>r.text()).then(html=>{const urls=html.match(/https:\/\/(?:www\.)?(?:youtube\.com\/(?:shorts\/|watch\?v=)|youtu\.be\/)[^'"\s]+/g)||[];ids=[...new Set(urls.map(url=>url.match(/(?:youtu\.be\/|shorts\/|watch\?v=)([^?&/]+)/)?.[1]).filter(Boolean))];ids.forEach((id,index)=>{const row=document.createElement('article');row.className='song';row.innerHTML=`<span class="song-number">${index+1}</span><span class="song-title">♫ ${titleFor(index)}<small>YouTube video • chronological position ${index+1}</small></span><button class="play" type="button">Play</button>`;row.querySelector('button').onclick=()=>{cardPlaylist=null;cardPosition=0;play(index)};list.appendChild(row)});buildGame();updateButtons();initPlayer()}).catch(()=>{list.innerHTML='<p>Unable to load the collection.</p>';buildGame()});
  </script>
</body>
</html>
